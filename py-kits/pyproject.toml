[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-py-kits"
version = "0.1.0"
description = "POD, DMD, noise generation and diagnostics for Location Uncertainty in NEMO"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "F. Tucciarone"}]
dependencies = ["numpy", "scipy", "netCDF4", "matplotlib", "pyyaml"]

[project.optional-dependencies]
mpi = ["mpi4py"]
maps = ["cartopy"]

[tool.setuptools.packages.find]
include = ["orcakit*", "modredkit*", "noisekit*", "diagkit*", "gyrekit*", "datakit*"]

[tool.setuptools.package-data]
gyrekit = ["config/*.yaml"]
